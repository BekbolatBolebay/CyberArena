# Cloudflare Tunnel үлгісі (сервер IP-ін сыртқа мүлдем ашпау үшін)
# 1. cloudflared tunnel login
# 2. cloudflared tunnel create cyberarena
# 3. cloudflared tunnel route dns cyberarena arena.yourdomain.kz
# 4. Осы файлды ~/.cloudflared/config.yml ретінде сақтап, <TUNNEL_UUID> ауыстырыңыз.

tunnel: <TUNNEL_UUID>
credentials-file: /root/.cloudflared/<TUNNEL_UUID>.json

ingress:
  - hostname: arena.yourdomain.kz
    service: http://127.0.0.1:8088
  - service: http_status:404
