worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Anti-DDoS / Brute-Force Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    upstream cyberarena_portal {
        server portal:8000;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 32k;

        # Auth & submit endpoints have tighter rate limits
        location ~ ^/api/(login|register|submit) {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://cyberarena_portal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            limit_req zone=general_limit burst=30 nodelay;
            proxy_pass http://cyberarena_portal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
